name: Electra CRM AI Daily Leads

on:
  schedule:
    # 20:30 UTC is 02:00 Asia/Kolkata on the following calendar day.
    - cron: "30 20 * * *"
  workflow_dispatch:

concurrency:
  group: electra-crm-ai-daily-leads
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CRM_API_URL: ${{ secrets.CRM_API_URL }}
      AI_DAILY_LEADS_SCHEDULER_SECRET: ${{ secrets.AI_DAILY_LEADS_SCHEDULER_SECRET || secrets.BACKUP_WORKFLOW_SECRET }}
    steps:
      - name: Generate the fixed AI Daily Leads batches
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$CRM_API_URL"
          test -n "$AI_DAILY_LEADS_SCHEDULER_SECRET"
          curl --fail-with-body --retry 3 --retry-all-errors --silent --show-error \
            --request POST "$CRM_API_URL/api/ai-daily-leads/scheduled-generate" \
            --header "x-ai-scheduler-secret: $AI_DAILY_LEADS_SCHEDULER_SECRET" \
            --header "Content-Type: application/json"
