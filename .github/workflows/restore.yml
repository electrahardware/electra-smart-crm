name: Electra CRM protected restore verification

on:
  workflow_dispatch:
    inputs:
      restore_job_id:
        description: CRM restore job ID
        required: true
        type: string
      mode:
        description: staging or production (production is policy-gated by the backend)
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: electra-crm-restore
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      CRM_API_URL: ${{ secrets.CRM_API_URL }}
      BACKUP_WORKFLOW_SECRET: ${{ secrets.BACKUP_WORKFLOW_SECRET }}
      # Only required after an explicit production-restore enablement review.
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL 18 client
        run: |
          set -Eeuo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update && sudo apt-get install --yes postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Start protected restore job
        id: start
        run: |
          set -Eeuo pipefail
          echo "started_at_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
          BODY=$(jq -nc --arg restoreJobId "${{ inputs.restore_job_id }}" --arg mode "${{ inputs.mode }}" '{restoreJobId:$restoreJobId,mode:$mode}')
          curl --fail-with-body --silent --show-error -X POST "$CRM_API_URL/api/backups/restore-workflow/start" -H "Content-Type: application/json" -H "x-backup-secret: $BACKUP_WORKFLOW_SECRET" --data "$BODY" > /tmp/restore.json
      - name: Download, decrypt, and restore to isolated staging PostgreSQL
        env:
          PGPASSWORD: staging
        run: |
          set -Eeuo pipefail
          sudo docker run --name electra-restore-staging -e POSTGRES_PASSWORD=staging -e POSTGRES_DB=electra_restore -d -p 54329:5432 postgres:18
          until pg_isready -h 127.0.0.1 -p 54329 -U postgres; do sleep 1; done
          FILE_ID=$(jq -r '.backup.storageFileId' /tmp/restore.json)
          ACCESS_TOKEN=$(node -e 'fetch("https://oauth2.googleapis.com/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:process.env.GOOGLE_DRIVE_CLIENT_ID,client_secret:process.env.GOOGLE_DRIVE_CLIENT_SECRET,refresh_token:process.env.GOOGLE_DRIVE_REFRESH_TOKEN,grant_type:"refresh_token"})}).then(r=>r.json()).then(x=>console.log(x.access_token))')
          curl --fail --silent --show-error -H "Authorization: Bearer $ACCESS_TOKEN" "https://www.googleapis.com/drive/v3/files/$FILE_ID?alt=media" -o /tmp/backup.dump.enc
          node scripts/decrypt-file.mjs /tmp/backup.dump.enc /tmp/backup.dump
          # The client must match the temporary PostgreSQL 18 database.
          pg_restore --version
          pg_restore --exit-on-error --no-owner --no-privileges -h 127.0.0.1 -p 54329 -U postgres -d electra_restore /tmp/backup.dump
          SCHEMA_EXISTS=$(PGPASSWORD=staging psql -h 127.0.0.1 -p 54329 -U postgres -d electra_restore -Atc "select exists(select 1 from pg_namespace where nspname='public')")
          # Must exactly match the backup workflow's application-table count.
          TABLE_COUNT_SQL="SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname = 'public';"
          TABLE_COUNT=$(PGPASSWORD=staging psql -h 127.0.0.1 -p 54329 -U postgres -d electra_restore -Atc "$TABLE_COUNT_SQL")
          ROW_COUNT=$(PGPASSWORD=staging psql -h 127.0.0.1 -p 54329 -U postgres -d electra_restore -Atc "select format('select count(*) from %I.%I;', schemaname, tablename) from pg_tables where schemaname='public'" | PGPASSWORD=staging psql -h 127.0.0.1 -p 54329 -U postgres -d electra_restore -At | awk '{total += $1} END {print total + 0}')
          INDEX_COUNT=$(PGPASSWORD=staging psql -h 127.0.0.1 -p 54329 -U postgres -d electra_restore -Atc "select count(*) from pg_indexes where schemaname='public'")
          CONSTRAINT_COUNT=$(PGPASSWORD=staging psql -h 127.0.0.1 -p 54329 -U postgres -d electra_restore -Atc "select count(*) from pg_constraint")
          DB_VERSION=$(PGPASSWORD=staging psql -h 127.0.0.1 -p 54329 -U postgres -d electra_restore -Atc 'show server_version')
          DATABASE_SIZE=$(PGPASSWORD=staging psql -h 127.0.0.1 -p 54329 -U postgres -d electra_restore -Atc "select pg_database_size(current_database())")
          if [[ "$SCHEMA_EXISTS" != "t" || "$TABLE_COUNT" -eq 0 ]]; then
            echo "Staging verification failed: public schema or restored tables are missing." >&2
            exit 1
          fi
          jq -nc --argjson tables "$TABLE_COUNT" --argjson rows "$ROW_COUNT" --argjson indexes "$INDEX_COUNT" --argjson constraints "$CONSTRAINT_COUNT" --argjson databaseSize "$DATABASE_SIZE" --arg version "$DB_VERSION" '{passed:true,pgRestoreExitCode:0,schemaExists:true,schemaCompared:true,tableCount:$tables,rowCount:$rows,indexCount:$indexes,constraintCount:$constraints,databaseSize:$databaseSize,databaseVersion:$version}' > /tmp/verification.json
      - name: Report staging verification
        if: always()
        run: |
          set -Eeuo pipefail
          STATUS="Failed"; ERROR="Staging restore verification failed"; VERIFICATION='{"passed":false}'
          if [[ -f /tmp/verification.json ]]; then STATUS="Success"; ERROR=""; VERIFICATION=$(cat /tmp/verification.json); fi
          DURATION_MS=$(( $(date +%s%3N) - ${{ steps.start.outputs.started_at_ms }} ))
          BODY=$(jq -nc --arg restoreJobId "${{ inputs.restore_job_id }}" --arg status "$STATUS" --arg errorMessage "$ERROR" --argjson durationMs "$DURATION_MS" --argjson verification "$VERIFICATION" '{restoreJobId:$restoreJobId,status:$status,errorMessage:$errorMessage,durationMs:$durationMs,verification:$verification}')
          curl --silent --show-error -X POST "$CRM_API_URL/api/backups/restore-workflow/report" -H "Content-Type: application/json" -H "x-backup-secret: $BACKUP_WORKFLOW_SECRET" --data "$BODY"
